[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-insight-system"
version = "0.1.0"
description = "基于大语言模型的员工信息智能分析与管理系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "lichao", email = "lichaoaaron@gmail.com" }]

[project.scripts]
employee-insight = "employee_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
